[[patch]]
    name = "Players numbered by join order"
    desc = "The first player to join is P1, whatever the controller: local lobby frames, names, race slots and the runner's shirt (P1 blue, P2 red, P3 green, P4 yellow, like the HUD and the billboards) all follow the join order. Needs the mod's data (its lobby script asks IsSlotUsed(frame + 4))."
    author = "crash course mod"
    is_enabled = true

    # Fighter template by slot: 829D0C0C lwz r31, 4(r31) (controller) -> mr r31, r28 (slot)
    [[patch.be32]]
        address = 0x829D0C0C
        value = 0x7F9FE378

