[[patch]]
    name = "Accept a local profile instead of Xbox LIVE"
    desc = "netman.IsXboxLiveAvailable and netman.IsLoggedIn answer true, so the menus accept a local profile. The game itself stays offline."
    author = "crash course mod"
    is_enabled = true

    # IsXboxLiveAvailable: 82AF5BD0 lbzx r6, r11, r8 -> li r6, 1
    [[patch.be32]]
        address = 0x82AF5BD0
        value = 0x38C00001

    # IsLoggedIn: both answers -> li r6, 1
